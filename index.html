<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP2 - Sistema de Signos Reactivos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fuente Montserrat en todos los pesos necesarios -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Botón de Modo Lámina (Solo PC) -->
    <button id="btn-fullscreen-grid" class="desk-only">MODO LÁMINA</button>

    <header>
        <p class="subtitle">Trabajo Práctico 2</p>
        <h1>SISTEMA DE SIGNOS DE REPRESENTACIÓN<br>GEOMÉTRICA, CINÉTICA Y REACTIVA</h1>
    </header>

    <div class="system-grid">
        <!-- Subsistema 1 -->
        <div class="interface-card">
            <div class="canvas-container"><canvas id="canvas-memoria"></canvas></div>
            <div class="info"><span class="concept-title">Memoria</span></div>
        </div>
        <div class="interface-card">
            <div class="canvas-container"><canvas id="canvas-herencia"></canvas></div>
            <div class="info"><span class="concept-title">Herencia</span></div>
        </div>
        <div class="interface-card">
            <div class="canvas-container"><canvas id="canvas-caducidad"></canvas></div>
            <div class="info"><span class="concept-title">Caducidad</span></div>
        </div>

        <!-- Subsistema 2 -->
        <div class="interface-card">
            <div class="canvas-container"><canvas id="canvas-identidad"></canvas></div>
            <div class="info"><span class="concept-title">Identidad</span></div>
        </div>
        <div class="interface-card">
            <div class="canvas-container"><canvas id="canvas-empatia"></canvas></div>
            <div class="info"><span class="concept-title">Empatía</span></div>
        </div>
        <div class="interface-card">
            <div class="canvas-container"><canvas id="canvas-colaboracion"></canvas></div>
            <div class="info"><span class="concept-title">Colaboración</span></div>
        </div>

        <!-- Subsistema 3 -->
        <div class="interface-card">
            <div class="canvas-container"><canvas id="canvas-incertidumbre"></canvas></div>
            <div class="info"><span class="concept-title">Incertidumbre</span></div>
        </div>
        <div class="interface-card">
            <div class="canvas-container"><canvas id="canvas-expectativa"></canvas></div>
            <div class="info"><span class="concept-title">Expectativa</span></div>
        </div>
        <div class="interface-card">
            <div class="canvas-container"><canvas id="canvas-ansiedad"></canvas></div>
            <div class="info"><span class="concept-title">Ansiedad</span></div>
        </div>
    </div>

    <!-- Vista Detalle (Overlay) -->
    <div id="detail-overlay" class="hidden">
        <div class="detail-content">
            <!-- Botón de volver para PC (Arriba a la izquierda) -->
            <button class="btn-volver desk-only">← VOLVER</button>

            <div class="detail-left">
                <span id="detail-subsystem" class="tag"></span>
                <h2 id="detail-title"></h2>
                <p id="detail-desc"></p>
            </div>

            <div class="detail-right" id="detail-canvas-container">
                <!-- El canvas activo se va a mover acá temporalmente mediante el JS -->
            </div>

            <!-- Botón de volver para Celular (Abajo de todo) -->
            <button class="btn-volver mob-only">← VOLVER</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
